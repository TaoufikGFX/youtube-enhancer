<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enhancer+ for YouTube</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img class="brand-mark" src="../../assets/icons/icon-128.png" alt="">
    <div class="brand">
      <h1><span class="grad-text">Enhancer+</span> for YouTube</h1>
      <small id="status">Ready</small>
    </div>
    <button class="icon-btn" id="open-options" title="All settings" aria-label="All settings">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.66 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.61.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.05.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
  </header>

  <main>
    <section class="card now" id="now">
      <button class="now-thumb" id="thumb-btn" title="Open thumbnail in best quality">
        <img id="thumb" alt="">
        <span class="now-open">
          <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
          Open HD thumbnail
        </span>
        <span class="now-res" id="thumb-res"></span>
        <span class="now-title" id="now-title"></span>
      </button>
    </section>
    <section class="card empty" id="empty" hidden>
      <svg viewBox="0 0 24 24"><path d="M10 16.5l6-4.5-6-4.5v9zM12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg>
      <p>Open a YouTube video to see its thumbnail and live controls.</p>
    </section>

    <section class="block">
      <div class="block-head">
        <h2>Repeat</h2>
        <small>Replays the current video</small>
      </div>
      <div class="seg wide" data-key="repeatMode">
        <button data-value="0">Off</button>
        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="-1">∞</button>
      </div>
    </section>

    <section class="block" id="speed-block">
      <div class="block-head">
        <h2>Speed</h2>
        <small id="speed-now">Current video</small>
      </div>
      <div class="seg wide" id="speed-seg">
        <button data-speed="0.5">0.5</button>
        <button data-speed="0.75">.75</button>
        <button data-speed="1">1×</button>
        <button data-speed="1.25">1.25</button>
        <button data-speed="1.5">1.5</button>
        <button data-speed="2">2</button>
        <button data-speed="3">3</button>
      </div>
    </section>

    <section class="block">
      <div class="block-head"><h2>Quick toggles</h2></div>
      <div class="tiles">
        <label class="tile"><input type="checkbox" data-key="boostOn"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg><span>Volume boost</span></label>
        <label class="tile"><input type="checkbox" data-key="miniPlayer"><svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V5c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 0H3V5h18v14z"/></svg><span>Mini player</span></label>
        <label class="tile"><input type="checkbox" data-key="disableAutoplay"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg><span>Autoplay off</span></label>
        <label class="tile"><input type="checkbox" data-key="hideEndscreen"><svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM5 15h6v2H5zm8 0h6v2h-6z"/></svg><span>No end cards</span></label>
        <label class="tile"><input type="checkbox" data-key="expandPlayer"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg><span>Expand player</span></label>
        <label class="tile"><input type="checkbox" data-key="hideRelated"><svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg><span>Hide related</span></label>
        <label class="tile"><input type="checkbox" data-key="hideChat"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg><span>Hide chat</span></label>
        <label class="tile"><input type="checkbox" data-key="hideComments"><svg viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18zM18 14H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg><span>No comments</span></label>
        <label class="tile"><input type="checkbox" data-key="hideShorts"><svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5L18 9.06a3.74 3.74 0 0 0-3.5-6.62L6 6.94a3.74 3.74 0 0 0 .23 6.74l1.2.49L6 14.93a3.75 3.75 0 0 0 3.5 6.63l8.5-4.5a3.74 3.74 0 0 0-.23-6.74zM10 14.65v-5.3L15 12l-5 2.65z"/></svg><span>Hide Shorts</span></label>
      </div>
    </section>

    <details class="block filters">
      <summary>
        <h2>Video filters</h2>
        <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
      </summary>
      <div class="filter-row"><span>Brightness</span><div class="range"><input type="range" min="30" max="200" data-key="filterBrightness" data-unit="%"><output data-for="filterBrightness"></output></div></div>
      <div class="filter-row"><span>Contrast</span><div class="range"><input type="range" min="30" max="200" data-key="filterContrast" data-unit="%"><output data-for="filterContrast"></output></div></div>
      <div class="filter-row"><span>Saturation</span><div class="range"><input type="range" min="0" max="300" data-key="filterSaturate" data-unit="%"><output data-for="filterSaturate"></output></div></div>
      <div class="filter-actions">
        <label class="chip"><input type="checkbox" data-key="flipH"> Flip ↔</label>
        <label class="chip"><input type="checkbox" data-key="flipV"> Flip ↕</label>
        <button class="btn ghost" id="reset-filters">Reset</button>
      </div>
    </details>
  </main>


  <script src="../shared/defaults.js"></script>
  <script src="../shared/bind.js"></script>
  <script src="popup.js"></script>
</body>
</html>
